name: 部署前端到 GitHub Pages

# 推送到 main 分支时：自动安装依赖 → 构建前端 → 发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，旧排队任务自动取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 dist 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
